[project]
name = "emsi-forum-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "achraal", email = "achrafbenagri28@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "exponent-server-sdk>=2.2.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
emsi-forum-backend = "emsi_forum_backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
